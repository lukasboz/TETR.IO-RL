[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetrio-rl"
version = "0.1.0"
description = "Placement-based reinforcement learning for TETR.IO-style stacking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3"]

[project.scripts]
tetrio-rl = "tetrio_rl.__main__:main"

[tool.setuptools.packages.find]
include = ["tetrio_rl*"]
